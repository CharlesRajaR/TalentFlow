spring.application.name=core-engine

# Server Configuration
server.port=8080

# MySQL Database Connection
# 'mysql' is the service name defined in your docker-compose file
spring.datasource.url=jdbc:mysql://mysql:3306/talentflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=talentflow
spring.datasource.password=talentflow
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.forward-headers-strategy=framework
springdoc.swagger-ui.display-request-duration=true


logging.level.org.springframework.security=DEBUG